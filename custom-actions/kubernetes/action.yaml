name: Setup Kubernetes with kubeadm
description: Installs kubeadm, kubelet, and kubectl, then initializes Kubernetes
runs:
  using: "composite"
  steps:
    - name: Install and configure Kubernetes prerequisites
      shell: bash
      run: |
        set -e

        echo "[1/9] Updating system and disabling swap"
        sudo apt update && sudo apt upgrade -y
        sudo swapoff -a
        sudo sed -i '/ swap / s/^/#/' /etc/fstab

        echo "[2/9] Setting kernel modules"
        cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
overlay
br_netfilter
EOF
        sudo modprobe overlay
        sudo modprobe br_netfilter

        echo "[3/9] Setting sysctl params"
        cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
net.bridge.bridge-nf-call-ip6tables = 1
net.bridge.bridge-nf-call-iptables = 1
net.ipv4.ip_forward = 1
EOF
        sudo sysctl --system

        echo "[4/9] Installing containerd"
        sudo apt install -y containerd
        sudo mkdir -p /etc/containerd
        containerd config default | sudo tee /etc/containerd/config.toml

        echo "[5/9] Configuring containerd to use SystemdCgroup"
        sudo sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        sudo systemctl restart containerd
        sudo systemctl enable containerd

        echo "[6/9] Installing Kubernetes APT dependencies"
        sudo apt install -y apt-transport-https ca-certificates curl gpg

        echo "[7/9] Adding Kubernetes repo and key"
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/kubernetes-apt-keyring.gpg
        echo "deb [signed-by=/etc/apt/trusted.gpg.d/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list

        echo "[8/9] Installing kubelet, kubeadm, kubectl"
        sudo apt update
        sudo apt install -y kubelet kubeadm kubectl
        sudo apt-mark hold kubelet kubeadm kubectl

        echo "[9/9] Setup complete"
