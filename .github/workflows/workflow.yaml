name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    name: Build and Deploy on Master Node
    runs-on:
      - self-hosted
      - master

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Docker
        uses: ./custom-actions/docker-install

      - name: Set Up Kubernetes with Kubeadm
        uses: ./custom-actions/kubeadm-setup

      - name: Install Helm
        uses: ./custom-actions/helm-install

      - name: Build Frontend Docker Image
        run: docker build -t frontend:latest ./frontend

      - name: Build Backend Docker Image
        run: docker build -t backend:latest ./backend

      - name: Deploy Using Helmfile
        run: |
          cd helm
          helmfile apply

      - name: Check Frontend Is Running
        run: |
          sleep 10
          curl -s http://localhost:30080/login || (echo "Frontend is not responding" && exit 1)
