name: Ansible Provisioning

on:
  push:
    branches:
      - develop

jobs:
  run-ansible:
    runs-on: ubuntu-latest
    name: Run Ansible to Setup Master and Worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key for Master
        run: |
          echo "${{ secrets.PEM_KEY_MASTER }}" > master.pem
          chmod 600 master.pem

      - name: Setup SSH Key for Worker
        run: |
          echo "${{ secrets.PEM_KEY_WORKER }}" > worker.pem
          chmod 600 worker.pem

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key=master.pem --user=${{ secrets.USER }}
